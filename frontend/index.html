<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232f6f55' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z'/><path d='M12 9v6'/><path d='M9 12h6'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1714" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Turn complex prescriptions into clear, verified instructions in English, Hindi and Marathi, with read-aloud audio." />
    <title>HealthBridge AI · Medicine instructions made simple</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Apply saved theme and text size before first paint to avoid a flash
      try {
        var t = localStorage.getItem('hb-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var s = localStorage.getItem('hb-text-size');
        if (s) document.documentElement.dataset.size = s;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
